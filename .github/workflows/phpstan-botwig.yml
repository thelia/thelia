name: phpstan-botwig

# Level-5 static-analysis guard-rail for the Twig back-office bundle
# (thelia/backoffice-default-twig-template). The bundle lives in its own repo
# (thelia-templates/default-twig) and is NOT loaded in the test env, so neither
# `composer phpstan` (core only) nor the PHPUnit suites cover it (debt B-052).
# This job closes that blind spot.
#
# PHPStan needs the Propel models generated (var/propel/test/model) to resolve the
# i18n getters. bin/test-prepare builds them via App\Kernel in-process (the cold
# TheliaKernel build used by the legacy `thelia:install` fails with "No schema files
# were found"). A .env.test.local points it at the runner's MySQL.
on:
  push:
    branches: [ '3.1' ]
  pull_request:
    branches: [ '3.1' ]

jobs:
  phpstan-botwig:
    name: PHPStan level 5 (BO Twig bundle)
    runs-on: ubuntu-latest
    env:
      # Without a token, Flex silently skips the thelia/thelia-recipes endpoint
      # and the GitHub archive the theme branch is downloaded from is rate limited.
      COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start MySQL
        # The runner ships MySQL pre-installed (root/root on 127.0.0.1:3306); using
        # it avoids the flaky service-container init on this runner image.
        run: sudo systemctl start mysql.service

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          ini-values: post_max_size=20M
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, mysql, gd, zip

      - name: Resolve the back-office theme from its 1.1 maintenance branch
        # This is the 3.1 maintenance line: the analysed theme is the tip of its `1.1`
        # branch, the one released with the core patches. Its `main` follows the next
        # minor of the core and does not run on 3.1. The other themes stay on their
        # published 1.1 releases, as composer.json requires.
        run: |
          composer require --no-update --no-scripts --no-audit \
            "thelia/backoffice-default-twig-template:1.1.x-dev"

      - name: Install Composer dependencies
        run: composer update --no-progress --prefer-dist --optimize-autoloader

      - name: Check that the analysed theme is the tip of its 1.1 branch
        run: |
          info=$(composer show thelia/backoffice-default-twig-template --format=json)
          version=$(php -r 'echo json_decode(stream_get_contents(STDIN), true)["versions"][0];' <<< "$info")
          reference=$(php -r '$p = json_decode(stream_get_contents(STDIN), true); echo $p["source"]["reference"] ?? $p["dist"]["reference"] ?? "unknown";' <<< "$info")
          echo "thelia/backoffice-default-twig-template -> $version ($reference)"
          [ "$version" = '1.1.x-dev' ] || { echo "::error::the theme resolved to $version, expected 1.1.x-dev"; exit 1; }

      - name: Prepare test env (builds the Propel models via App\Kernel)
        run: |
          printf 'DATABASE_HOST=127.0.0.1\nDATABASE_PORT=3306\nDATABASE_USER=root\nDATABASE_PASSWORD=root\nDATABASE_NAME=test\n' > .env.test.local
          php bin/test-prepare

      - name: PHPStan (level and paths come from phpstan-botwig.neon)
        run: ./vendor/bin/phpstan analyse -c phpstan-botwig.neon --no-progress --error-format=github
