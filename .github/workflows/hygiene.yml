name: hygiene

# Two audits that report and never fail: the vulnerable dependencies and the
# weaknesses of the workflows themselves. They are a signal for now; a finding is
# written in the job summary and raised as one annotation.
#
# Neither job is a required check, and continue-on-error keeps a broken tool from
# turning the run red.
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'composer.json'
      - 'core/composer.json'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - 'composer.json'
      - 'core/composer.json'
  # An advisory is published without any push to this repository.
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composer-audit:
    name: Composer audit (signal)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    env:
      COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, mysql, gd, zip
          coverage: none

      - name: Resolve the dependencies
        # No composer.lock is committed: the audit needs the versions the CI would
        # install today, so they are resolved here without installing anything.
        run: composer update --no-install --no-scripts --no-plugins --no-audit --no-progress

      - name: Audit the resolved versions
        run: |
          code=0
          composer audit --locked --no-ansi > "$RUNNER_TEMP/audit.txt" 2>&1 || code=$?
          {
            echo '## Composer audit'
            echo
            echo '```'
            cat "$RUNNER_TEMP/audit.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            echo "::warning title=composer audit::advisories or abandoned packages reported (exit code $code), see the job summary."
          fi
          exit 0

  zizmor:
    name: Workflow audit with zizmor (signal)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    env:
      # Some audits ask the GitHub API about the actions a workflow uses.
      GH_TOKEN: ${{ github.token }}
      NO_COLOR: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Audit the workflows
        run: |
          code=0
          pipx run zizmor==1.31.1 --no-exit-codes --no-progress .github/workflows > "$RUNNER_TEMP/zizmor.txt" 2>&1 || code=$?
          {
            echo '## zizmor'
            echo
            echo '<details><summary>Findings</summary>'
            echo
            echo '```'
            cat "$RUNNER_TEMP/zizmor.txt"
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            echo "::warning title=zizmor::the audit did not complete (exit code $code), see the job summary."
          elif grep -q '^No findings' "$RUNNER_TEMP/zizmor.txt"; then
            echo "::notice title=zizmor::no finding."
          else
            echo "::warning title=zizmor::$(tail -n 1 "$RUNNER_TEMP/zizmor.txt"), see the job summary."
          fi
          exit 0
