name: test

on:
  push:
    branches: [ '3.2' ]
  pull_request:
    branches: [ '3.2' ]

# A new push to a pull request makes its previous run pointless: cancel it and
# give the runners back (the organisation shares a pool of concurrent jobs).
# Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    # The suites used to run one after the other in a single job per PHP
    # version (~15 minutes on 8.4). Each group now runs in its own job, in
    # parallel; the static checks do not depend on the runtime, so they run
    # once, on the lowest supported version.
    name: ${{ matrix.group }} (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.3', '8.4', '8.5' ]
        group: [ static, integration, api, http ]
        exclude:
          - { php: '8.4', group: static }
          - { php: '8.5', group: static }
        include:
          - { group: integration, suites: integration }
          - { group: api, suites: api }
          - { group: http, suites: unit http-flexy http-backoffice }
    # A leaked DB transaction once kept a DDL test waiting on a metadata lock
    # until the 6-hour runner limit. The longest group takes ~6 minutes;
    # anything beyond this is a hang, fail fast.
    timeout-minutes: 20
    env:
      PHP_CS_FIXER_IGNORE_ENV: 1
      # Without a token, Flex silently skips the thelia/thelia-recipes endpoint
      # and the GitHub archives the theme branches are downloaded from are rate
      # limited per runner IP.
      COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start MySQL
        # The runner ships MySQL pre-installed (root/root on 127.0.0.1:3306); using
        # it avoids the flaky service-container init on this runner image.
        run: sudo systemctl start mysql.service

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          ini-values: post_max_size=20M
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, mysql, gd, zip
          coverage: none

      - name: Prepare the test database credentials
        # bin/test-prepare (run below) reads these to create the test database,
        # build the Propel models and generate the JWT keys.
        run: printf 'DATABASE_HOST=127.0.0.1\nDATABASE_PORT=3306\nDATABASE_USER=root\nDATABASE_PASSWORD=root\nDATABASE_NAME=test\n' > .env.test.local

      - name: Resolve the back-office theme from its 1.2 maintenance branch
        # This is the 3.2 maintenance line. The development tips of the themes
        # (`main`) follow the next minor of the core and do not run on 3.2, so the
        # themes come from their own 1.2 line: the back-office theme from its `1.2`
        # branch, which carries the fixes released with the core patches, and the
        # other themes from their published 1.2 releases, as composer.json requires.
        # thelia/flexy cannot come from its `1.2` branch yet: its `main` declares the
        # branch-alias 1.2.x-dev, so `1.2.x-dev` resolves to `main`.
        run: |
          composer require --no-update --no-scripts --no-audit \
            "thelia/backoffice-default-twig-template:1.2.x-dev"

      - name: Locate the Composer download cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore the Composer download cache
        # Only the downloaded archives are cached: without a committed lock file
        # every run still resolves the dependencies afresh.
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        # No composer.lock is committed, so `install` resolves exactly like `update`;
        # running both did the resolution twice.
        run: composer update --no-progress --prefer-dist --optimize-autoloader

      - name: Check that the themes under test are on their 1.2 line
        # The back-office theme must be the tip of its `1.2` branch; the other themes
        # must be published 1.2 releases, never a development version of a later line.
        run: |
          for package in flexy backoffice-default-twig-template email-default-template pdf-default-template; do
            info=$(composer show "thelia/$package" --format=json)
            version=$(php -r 'echo json_decode(stream_get_contents(STDIN), true)["versions"][0];' <<< "$info")
            reference=$(php -r '$p = json_decode(stream_get_contents(STDIN), true); echo $p["source"]["reference"] ?? $p["dist"]["reference"] ?? "unknown";' <<< "$info")
            echo "thelia/$package -> $version ($reference)"
            case "$package:$version" in
              backoffice-default-twig-template:1.2.x-dev) ;;
              backoffice-default-twig-template:*|*:*-dev|*:dev-*) echo "::error::thelia/$package resolved to $version, outside the expected 1.2 line"; exit 1 ;;
              *:1.2.*) ;;
              *) echo "::error::thelia/$package resolved to $version, outside the expected 1.2 line"; exit 1 ;;
            esac
          done

      - name: Build the test database
        # The Twig lint and the test suites both need the Propel models, which are
        # generated against the test database.
        run: php bin/test-prepare

      - name: Lint the YAML config and the Twig themes
        if: matrix.group == 'static'
        # The back-office default-twig theme is left out on purpose: its `safe_hook`
        # Twig function is unknown to the bare console environment, so a plain lint
        # reports false errors on it; that theme is covered by the phpstan-botwig job.
        run: |
          php bin/console lint:yaml config/ --env=test --no-debug
          php bin/console lint:twig templates/frontOffice templates/email templates/pdf core/lib/Thelia/Resources/views --env=test --no-debug

      - name: Coding standard
        if: matrix.group == 'static'
        run: composer cs-diff

      - name: Static analysis
        if: matrix.group == 'static'
        run: composer phpstan

      - name: Restore the Sass and Tailwind binaries
        if: matrix.group != 'static'
        # sass:build and tailwind:build download their binary from the GitHub releases
        # when it is missing: a 500 from github.com failed a whole integration job
        # (30/09/2026). The versions come from the locked bundles and the theme config,
        # so the lock file keys the cache; a stale entry only costs a new download.
        uses: actions/cache@v4
        with:
          path: |
            var/dart-sass
            var/tailwind/v*
          key: asset-binaries-${{ runner.os }}-${{ hashFiles('composer.lock', 'templates/frontOffice/*/config/**') }}
          restore-keys: asset-binaries-${{ runner.os }}-

      - name: Build the theme assets and warm the test container
        if: matrix.group != 'static'
        # Every HTTP test renders a page, and a page whose theme assets are missing
        # raises an exception that WebIntegrationTestCase::assertPageRenders() turns
        # into a *skipped* test. Without this step the two HTTP suites reported 116
        # skips out of 147: the suites that prove pages render were switched off.
        # The asset commands read the active templates from the database, so
        # bin/test-prepare comes first.
        #
        # --no-debug everywhere: phpunit.xml.dist forces APP_DEBUG=0, and a debug
        # container is a different class the suites would never load.
        run: |
          php bin/console importmap:install --env=test --no-debug
          php bin/console tailwind:build --env=test --no-debug
          php bin/console sass:build --env=test --no-debug
          php bin/console cache:warmup --env=test --no-debug

      - name: Run the ${{ matrix.group }} tests
        if: matrix.group != 'static'
        # Every suite of the group runs even when an earlier one fails, so a single
        # run reports all of them.
        run: |
          status=0
          for suite in ${{ matrix.suites }}; do
            echo "::group::$suite"
            composer "test:$suite" || status=1
            echo "::endgroup::"
          done
          exit $status

  ci:
    # The branch protection of main requires these three check names. Each one
    # passes only when every job above succeeded: a failure on one PHP version
    # turns the three of them red, the failing job names which one it is.
    name: CI (coding standard, static analysis, tests) (${{ matrix.php }})
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '8.3', '8.4', '8.5' ]
    steps:
      - name: Require every check job to have passed
        run: |
          echo "checks: ${{ needs.checks.result }}"
          test "${{ needs.checks.result }}" = success
