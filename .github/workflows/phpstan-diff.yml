name: phpstan-diff

# Level-5 static analysis of the lines a pull request adds. `composer phpstan`
# stays at level 1 against its baseline (test.yml); this raises the bar for new
# code only, and reports what it finds as annotations on the changed lines. It is
# a signal: nothing here fails a check, and the job is not a required one.
#
# phpstan-diff.neon holds the level and drops the baseline; reviewdog keeps only
# the findings that sit on added lines, read from the diff of the merge commit.
# Nothing is posted through the GitHub API, so a pull request from a fork, whose
# token is read-only, gets the same annotations as one from this repository.
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'core/**'
      - 'src/**'
      - 'phpstan*.neon'
      - 'phpstan_autoload.php'
      - 'composer.json'
      - '.github/workflows/phpstan-diff.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# What the token of a pull request from a fork gets.
permissions:
  contents: read

jobs:
  phpstan-diff:
    name: PHPStan level 5 on added lines (signal)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    env:
      COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The merge commit and its two parents: `git diff HEAD^1` is exactly
          # what the pull request changes.
          fetch-depth: 2
          persist-credentials: false

      - name: Start MySQL
        run: sudo systemctl start mysql.service

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          ini-values: post_max_size=20M
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, mysql, gd, zip
          coverage: none

      - name: Resolve the themes from their development branch
        # Same resolution as the static job of test.yml, the one `composer phpstan`
        # is proven on.
        run: |
          composer require --no-update --no-scripts --no-audit \
            "thelia/flexy:dev-main as 1.99.0" \
            "thelia/backoffice-default-twig-template:dev-main as 1.99.0" \
            "thelia/email-default-template:dev-main as 1.99.0" \
            "thelia/pdf-default-template:dev-main as 1.99.0"

      - name: Locate the Composer download cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore the Composer download cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer update --no-progress --prefer-dist --optimize-autoloader

      - name: Build the test database
        # The Propel models PHPStan reads are generated against it.
        run: |
          printf 'DATABASE_HOST=127.0.0.1\nDATABASE_PORT=3306\nDATABASE_USER=root\nDATABASE_PASSWORD=root\nDATABASE_NAME=test\n' > .env.test.local
          php bin/test-prepare

      - name: Analyse at level 5
        # PHPStan exits with 1 as soon as it reports something; the report is what
        # matters. Findings are downgraded to warnings: this is a signal.
        run: |
          php -d memory_limit=-1 ./vendor/bin/phpstan analyse -c phpstan-diff.neon --no-progress --error-format=checkstyle > "$RUNNER_TEMP/phpstan.xml" || true
          if ! grep -q '<checkstyle' "$RUNNER_TEMP/phpstan.xml"; then
            echo "::warning title=PHPStan level 5::the analysis did not produce a report."
            head -c 2000 "$RUNNER_TEMP/phpstan.xml"
            exit 1
          fi
          sed -i 's/severity="error"/severity="warning"/' "$RUNNER_TEMP/phpstan.xml"

      - name: Install reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: v0.21.2

      - name: List the findings on added lines in the job summary
        run: |
          reviewdog -f=checkstyle -name=phpstan -reporter=local -filter-mode=added -fail-level=none -diff='git diff HEAD^1' < "$RUNNER_TEMP/phpstan.xml" > "$RUNNER_TEMP/added.txt"
          cat "$RUNNER_TEMP/added.txt"
          count=$(grep -cE '^[^ ]+:[0-9]+:[0-9]+: ' "$RUNNER_TEMP/added.txt" || true)
          {
            echo '## PHPStan level 5 on added lines'
            echo
            if [ "$count" -eq 0 ]; then
              echo 'No finding on the lines this pull request adds.'
            else
              echo "$count finding(s) on the lines this pull request adds. Signal only: this check never fails."
              echo
              echo '```'
              cat "$RUNNER_TEMP/added.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate the added lines
        # GitHub shows at most ten warnings per step: the summary above lists all of them.
        env:
          # Required by this reporter even though it only writes workflow commands.
          REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
        run: reviewdog -f=checkstyle -name=phpstan -reporter=github-pr-annotations -filter-mode=added -fail-level=none -diff='git diff HEAD^1' < "$RUNNER_TEMP/phpstan.xml"
